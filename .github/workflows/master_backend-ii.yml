name: Build and deploy Node.js app to Azure Web App - backend-ii

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install zip utility
        run: choco install zip -y --no-progress

      - name: Verify zip installation
        run: zip --version

      - name: npm install and build (only production dependencies)
        run: |
          npm install --production
          npm run build --if-present
          npm prune --production
          zip -r deploy.zip * -x "node_modules/**" "tests/**" ".git/**"

      - name: Show ZIP contents
        run: unzip -l deploy.zip

      - name: Verify ZIP file
        run: unzip -t deploy.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: List files after download
        run: ls -l

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Verify Azure Login
        run: az account show

      - name: Enable build during deployment
        run: |
          az webapp config appsettings set --resource-group backend --name backend-ii --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'backend-ii'
          slot-name: 'Production'
          package: deploy.zip
